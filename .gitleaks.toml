# Gitleaks configuration — runs in CI on the full git history.
# https://github.com/gitleaks/gitleaks#configuration

title = "PortDash R4 secret scanning"

[extend]
useDefault = true

[[rules]]
id = "portsight-jwt-secret-assignment"
description = "Hardcoded JWT_SECRET value committed to the repository"
regex = '''JWT_SECRET\s*=\s*["']?[A-Za-z0-9_\-]{32,}["']?'''
tags = ["secret", "jwt"]

[[rules]]
id = "portsight-bootstrap-password"
description = "Hardcoded bootstrap PIC password"
regex = '''BOOTSTRAP_PIC_PASSWORD\s*=\s*["']?[^\s"']{8,}["']?'''
tags = ["secret", "password"]

[[allowlists]]
description = "Placeholder values used by CI and .env.example"
paths = ['''\.env\.example$''', '''^\.github/workflows/''']
regexes = [
  '''ganti_dengan_secret''',
  '''placeholder''',
  '''ci_build_password_placeholder''',
  '''ci_regression_password_placeholder''',
  '''ci_build_secret_placeholder_value_at_least_32_chars''',
  '''ci_regression_secret_placeholder_value_32_chars''',
]

[[allowlists]]
description = "Generated build output and local data files are not part of the source tree"
paths = ['''^\.next/''', '''^node_modules/''', '''^data/.*\.db''', '''^data/.*\.xlsx''']
