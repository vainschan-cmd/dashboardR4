name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so a credential committed and later removed is still caught.
          fetch-depth: 0

      - name: Scan git history for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Pin the CLI: the action's own default (8.24.3) silently ignores the
          # plural `[[allowlists]]` config form, so an allowlist that works with
          # a newer CLI is a no-op here. `.gitleaks.toml` uses the singular
          # `[allowlist]` table, which both 8.24.3 and 8.30.1 honour — pinning
          # keeps that verified behaviour instead of whatever ships next.
          GITLEAKS_VERSION: '8.30.1'

  quality:
    name: Typecheck, Lint, Unit tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_pg_password_placeholder
          POSTGRES_DB: ed_dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ed_dashboard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:ci_pg_password_placeholder@localhost:5432/ed_dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # `node:sqlite` requires Node >= 22.5
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Warnings must stay at zero; a new warning fails the build.
      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Initialize PostgreSQL schema
        run: node scripts/bootstrap_postgres.mjs
        env:
          BOOTSTRAP_PIC_PASSWORD: ci_build_password_placeholder

      - name: Unit tests
        run: npm test

      - name: Dependency audit (high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
        env:
          JWT_SECRET: ci_build_secret_placeholder_value_at_least_32_chars
          BOOTSTRAP_PIC_PASSWORD: ci_build_password_placeholder
          NODE_ENV: production

  regression:
    name: Security regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_pg_password_placeholder
          POSTGRES_DB: ed_dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ed_dashboard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: ci_regression_secret_placeholder_value_at_least_32_chars
      BOOTSTRAP_PIC_PASSWORD: ci_regression_password_placeholder
      ALLOW_PUBLIC_REGISTRATION: 'false'
      DATABASE_URL: postgresql://postgres:ci_pg_password_placeholder@localhost:5432/ed_dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap PostgreSQL database
        run: node scripts/bootstrap_postgres.mjs
        env:
          BOOTSTRAP_TEST_READY: 'true'

      - name: Start server
        run: |
          npm run build
          npm run start &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/users/login >/dev/null 2>&1 || curl -s -o /dev/null http://localhost:3000/; then
              break
            fi
            sleep 1
          done

      - name: Run regression tests
        run: node scripts/regression-test.mjs
        env:
          TEST_BASE_URL: http://localhost:3000
          TEST_PIC_PASSWORD: ${{ env.BOOTSTRAP_PIC_PASSWORD }}
          TEST_ADMIN_PASSWORD: ${{ env.BOOTSTRAP_PIC_PASSWORD }}
          TEST_VIEWER_PASSWORD: ${{ env.BOOTSTRAP_PIC_PASSWORD }}
